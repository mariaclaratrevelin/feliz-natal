<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natal Feliz</title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="container">
            <p class="etiqueta">)Bem)vindo!)</p>
            <p class="titulo">Natal Feliz</p>
            <p class="subtitulo-cabecalho">
                Aqui você encontrará tudo sobre o feriado mais amado de todos!
            </p>
            <nav class="menu-principal">
                <a class="link" href="../pages/tradicoes.html">Tradições</a>
                <a class="link" href="../pages/natalbr.html">Natal no Brasil</a>
            </nav>
        </div>
    </header>

    <main>
        <form class="formulario" action="#" method="post">
            <h2 class="subtitulo-forms">Se cadastre para doar e faça o Natal de alguém melhor!</h2>
            <br>
                <fieldset>

                    <legend>Identificação</legend>

                    <div class="campo-formulario">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome Completo" minlength="3"
                            maxlength="80" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="email">E-mail:</label>
                        <input type="email" name="email" id="email" placeholder="email@example.com.br" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone">
                    </div>

                </fieldset>

               
                <fieldset>
                    <legend>Mensagem:</legend>
                    <div class="campo-formulario">
                        <label for="mensagem">Escreva sua mensagem:</label>
                        <textarea name="mensagem" id="mensagem" rows="8" minlength="10" maxlength="1000"
                            placeholder="Escreva aqui..." required></textarea>
                    </div>
                </fieldset>
                <div class="acoes-formulario">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>

                </div>
            </form>
        
            <div>
                <p class="luzinhas">))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))</p>
            </div>

    </main>

    <footer class="rodape">
        <div class="container">
            <p>&copy; 2026 Maria Clara Trevelin</p>
        </div>
    </footer>
</body>

</html>
